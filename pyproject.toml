[project]
name = "midas-api"
version = "0.1.0"
description = "MIDAS API webservice and data update pipeline"
readme = "readme.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "flasgger==0.9.7.1",
  "flask==3.0.0",
  "werkzeug==3.0.1",
  "requests~=2.31.0",
  "numpy~=1.26.4",
  "pandas~=2.2.1",
  "python-decouple~=3.8",
  "gunicorn>=21.2.0,<23",
]

[dependency-groups]
dev = [
  "pytest==7.4.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
